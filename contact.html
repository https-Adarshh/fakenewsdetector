<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contactus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contact-container">
        <div class="contact-form-section">
            <h2 class="contact-title">Contact Us</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <div class="input-container">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" id="name" placeholder="Name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <div class="input-container textarea-container">
                        <textarea id="message" rows="4" placeholder="Message"></textarea>
                    </div>
                </div>
                <button type="submit" class="send-message-btn">Send Message</button>
            </form>
        </div>

        <div class="contact-info-section">
            <h3 class="info-title">Contact Information</h3>
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <p>Pranveer Singh Institute of Technology Psit Kanpur, NH 19, Kanpur, Bhauti, Uttar Pradesh 209305 </p>
            </div>
            <div class="info-item">
                <i class="fas fa-phone-alt"></i>
                <p>7388228497,9696457303</p>
            </div>
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <p>2k24.csds1a.2410684@gmail.com</p>
            </div>
            <div class="map-container">
                <div class="map-placeholder">
<iframe

height="450"

</iframe>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
